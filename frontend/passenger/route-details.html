<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSRTC — Route Details | Hubballi–Dharwad</title>
    <link rel="stylesheet" href="/css/ksrtc-theme.css">
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="ksrtc-header">
        <a href="/passenger/home.html" class="ksrtc-brand">
            <div class="ksrtc-logo-icon">K</div>
            <div class="ksrtc-title-block">
                <h1>KSRTC LOCAL BUS TRACKING</h1>
                <span>Transit Route Corridor</span>
            </div>
        </a>
        <div class="ksrtc-nav-links">
            <a href="/passenger/home.html" class="ksrtc-nav-link">Home</a>
            <a href="/passenger/favourites.html" class="ksrtc-nav-link">Favourites</a>
            <a href="/passenger/account.html" class="ksrtc-nav-link">Account</a>
            <button class="btn-logout" onclick="auth.logout()">Logout</button>
        </div>
    </header>

    <main class="dashboard-container">
        
        <!-- Header & Action Buttons -->
        <div class="content-card" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <div>
                <a href="/passenger/home.html" style="color: var(--ksrtc-primary); text-decoration: none; font-size: 0.85rem; font-weight: 600;">← Back to Home</a>
                <h2 id="route-title" style="font-size: 1.4rem; color: var(--ksrtc-dark); margin-top: 4px;">Loading Route...</h2>
                <p id="route-subtitle" style="font-size: 0.9rem; color: var(--text-secondary);"></p>
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn-primary" id="btn-fav" onclick="toggleFavourite()" style="width: auto; background: #e2e8f0; color: #1e293b; padding: 10px 18px;">
                    ⭐ Save Favourite
                </button>
                <button type="button" class="btn-primary" id="btn-track-active" onclick="trackFirstActiveBus()" style="width: auto; padding: 10px 20px;">
                    📍 Track Route Bus
                </button>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 340px; gap: 20px; align-items: start;">
            
            <!-- Interactive Route Leaflet Map -->
            <div class="content-card" style="padding: 0; overflow: hidden;">
                <div id="route-map" style="width: 100%; height: 500px;"></div>
            </div>

            <!-- Ordered Stop Sequence List -->
            <div class="content-card" style="max-height: 500px; overflow-y: auto;">
                <h3 style="font-size: 1.05rem; color: var(--ksrtc-dark); margin-bottom: 14px; position: sticky; top: 0; background: white; padding-bottom: 8px; border-bottom: 1px solid var(--border-color);">
                    🚏 Sequenced Stops (<span id="stops-count">0</span>)
                </h3>
                <div id="stops-timeline" style="display: flex; flex-direction: column; gap: 12px;">
                    <!-- Populated dynamically -->
                </div>
            </div>

        </div>

    </main>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/map-helper.js"></script>

    <script>
        let routeData = null;
        let mapInstance = null;
        let currentRouteId = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const user = await auth.guard('passenger');
            if (!user) return;

            const params = new URLSearchParams(window.location.search);
            currentRouteId = params.get('routeId');

            if (!currentRouteId) {
                window.location.href = '/passenger/home.html';
                return;
            }

            mapInstance = MapHelper.initMap('route-map');
            await loadRouteDetails(currentRouteId);
        });

        async function loadRouteDetails(routeId) {
            try {
                const res = await api.get(`/routes/${routeId}`);
                if (!res || !res.success || !res.route) {
                    alert('Route not found.');
                    window.location.href = '/passenger/home.html';
                    return;
                }

                routeData = res.route;
                document.getElementById('route-title').textContent = `${routeData.route_number} — ${routeData.route_name}`;
                document.getElementById('route-subtitle').textContent = `Coverage: ${routeData.city_coverage} (${routeData.source} ➔ ${routeData.destination})`;

                const stops = routeData.forward_stops || [];
                document.getElementById('stops-count').textContent = stops.length;

                renderStopsTimeline(stops);
                renderRouteMap(stops);

            } catch (err) {
                console.error('Failed to load route:', err);
            }
        }

        function renderStopsTimeline(stops) {
            const container = document.getElementById('stops-timeline');
            if (stops.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted); font-size: 0.85rem;">No stops sequenced for this route yet.</p>`;
                return;
            }

            container.innerHTML = stops.map((item, idx) => {
                const isStart = idx === 0;
                const isEnd = idx === stops.length - 1;
                const badgeColor = isStart ? '#16a34a' : (isEnd ? '#dc2626' : '#0284c7');
                const stop = item.stop;

                return `
                    <div style="display: flex; gap: 12px; align-items: flex-start;">
                        <div style="width: 24px; height: 24px; border-radius: 50%; background: ${badgeColor}; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; flex-shrink: 0;">
                            ${item.stop_sequence}
                        </div>
                        <div>
                            <strong style="font-size: 0.9rem; color: var(--text-primary); display: block;">${stop.stop_name}</strong>
                            <span style="font-size: 0.75rem; color: var(--text-muted);">${stop.city} • ${stop.address || ''}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderRouteMap(stops) {
            if (!stops || stops.length === 0) return;

            const latlngs = [];

            stops.forEach((item, idx) => {
                const stop = item.stop;
                const lat = parseFloat(stop.latitude);
                const lng = parseFloat(stop.longitude);
                latlngs.push([lat, lng]);

                let type = 'regular';
                if (idx === 0) type = 'boarding';
                else if (idx === stops.length - 1) type = 'destination';

                const marker = L.marker([lat, lng], {
                    icon: MapHelper.createStopIcon(type, stop.stop_name)
                }).addTo(mapInstance);

                marker.bindPopup(`<strong>Stop ${item.stop_sequence}: ${stop.stop_name}</strong><br><small>${stop.city}</small>`);
            });

            // Draw corridor route line
            MapHelper.drawRouteLine(mapInstance, latlngs, {
                color: '#0056b3',
                weight: 5,
                fitBounds: true
            });
        }

        function trackFirstActiveBus() {
            if (routeData && routeData.buses && routeData.buses.length > 0) {
                const firstBus = routeData.buses[0];
                window.location.href = `/passenger/live-tracking.html?busId=${firstBus.id}`;
            } else {
                alert('No buses are currently assigned to this route.');
            }
        }

        async function toggleFavourite() {
            try {
                const res = await api.post('/passengers/favourites', {
                    route_id: currentRouteId
                });
                if (res && res.success) {
                    alert('Route saved to your favourites!');
                } else {
                    alert(res.message || 'Could not save favourite.');
                }
            } catch (err) {
                console.error('Favourite error:', err);
            }
        }
    </script>
</body>
</html>
